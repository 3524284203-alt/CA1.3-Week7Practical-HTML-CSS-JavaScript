<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Arithmetic Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <h1>Basic Arithmetic Calculator</h1>
    <p>Enter two numbers and choose an operation.</p>

    <div class="input-group">
      <label for="first-number">First number</label>
      <input id="first-number" type="number" step="any" placeholder="Enter a number">
    </div>

    <div class="input-group">
      <label for="second-number">Second number</label>
      <input id="second-number" type="number" step="any" placeholder="Enter a number">
    </div>

    <div class="operations" aria-label="Arithmetic operations">
      <button type="button" data-operation="add">Add (+)</button>
      <button type="button" data-operation="subtract">Subtract (−)</button>
      <button type="button" data-operation="multiply">Multiply (×)</button>
      <button type="button" data-operation="divide">Divide (÷)</button>
    </div>

    <p id="result" class="result" aria-live="polite">Result: —</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
